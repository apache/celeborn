suite: Test Celeborn worker statefulset

templates:
  - configmap.yaml
  - worker/statefulset.yaml

release:
  name: celeborn
  namespace: celeborn

tests:
  - it: Should create worker statefulset
    template: worker/statefulset.yaml
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: StatefulSet
          name: celeborn-worker
          namespace: celeborn

  - it: Should add checksum annotation referencing configmap
    template: worker/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["celeborn.apache.org/conf-hash"]
          value: 035c23a53d85eb407eecf3fe864be5e623afae38e8ecdd4c10579e76d85f5c6b

  - it: Should change checksum annotation when celeborn config changes
    template: worker/statefulset.yaml
    set:
      celeborn:
        "celeborn.rpc.io.serverThreads": 128
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["celeborn.apache.org/conf-hash"]
          value: 035c23a53d85eb407eecf3fe864be5e623afae38e8ecdd4c10579e76d85f5c6b
      - equal:
          path: spec.template.metadata.annotations["celeborn.apache.org/conf-hash"]
          value: d15c180987eca7e3b13dc37e3277c057a4060799ddd45cf20490ebb91da21ee1

  - it: Should add extra pod annotations if `worker.annotations` is specified
    template: worker/statefulset.yaml
    set:
      worker:
        annotations:
          key1: value1
          key2: value2
    asserts:
      - equal:
          path: spec.template.metadata.annotations.key1
          value: value1
      - equal:
          path: spec.template.metadata.annotations.key2
          value: value2

  - it: Should use the specified image if `image.registry`, `image.repository` and `image.tag` is set
    template: worker/statefulset.yaml
    set:
      image:
        registry: test-registry
        repository: test-repository
        tag: test-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="celeborn")].image
          value: test-registry/test-repository:test-tag

  - it: Should use the specified image pull policy if `image.pullPolicy` is set
    template: worker/statefulset.yaml
    set:
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: Should use the specified replicas if `worker.replicas` is set
    template: worker/statefulset.yaml
    set:
      worker.replicas: 10
    asserts:
      - equal:
          path: spec.replicas
          value: 10

  - it: Should use the specified terminationGracePeriodSeconds if `worker.terminationGracePeriodSeconds` is set
    template: worker/statefulset.yaml
    set:
      worker.terminationGracePeriodSeconds: 70
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 70

  - it: Should add environment variables if `worker.env` is set
    template: worker/statefulset.yaml
    set:
      worker:
        env:
          - name: test-env-name-1
            value: test-env-value-1
          - name: test-env-name-2
            valueFrom:
              configMapKeyRef:
                name: test-configmap
                key: test-key
                optional: false
          - name: test-env-name-3
            valueFrom:
              secretKeyRef:
                name: test-secret
                key: test-key
                optional: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: test-env-name-1
            value: test-env-value-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: test-env-name-2
            valueFrom:
              configMapKeyRef:
                name: test-configmap
                key: test-key
                optional: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: test-env-name-3
            valueFrom:
              secretKeyRef:
                name: test-secret
                key: test-key
                optional: false

  - it: Should add environment variable sources if `worker.envFrom` is set
    template: worker/statefulset.yaml
    set:
      worker:
        envFrom:
          - configMapRef:
              name: test-configmap
              optional: false
          - secretRef:
              name: test-secret
              optional: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: test-configmap
              optional: false
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-secret
              optional: false

  - it: Should add volume mounts if `worker.volumeMounts` is set
    template: worker/statefulset.yaml
    set:
      worker:
        volumeMounts:
          - name: disk1
            mountPath: /mnt/disk1
          - name: disk2
            mountPath: /mnt/disk2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: disk1
            mountPath: /mnt/disk1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: disk1
            mountPath: /mnt/disk1

  - it: Should use the specified resources if `worker.resources` is set
    template: worker/statefulset.yaml
    set:
      worker:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      - equal:
          path: spec.template.spec.containers[?(@.name=='celeborn')].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi

  - it: Should add container securityContext if `worker.securityContext` is set
    template: worker/statefulset.yaml
    set:
      worker:
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 2000
          fsGroup: 3000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          privileged: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 2000
            fsGroup: 3000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            privileged: false

  - it: Should add secrets if `imagePullSecrets` is set
    template: worker/statefulset.yaml
    set:
      imagePullSecrets:
        - name: test-secret1
        - name: test-secret2
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-secret1
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: test-secret2

  - it: Should add volumes if `worker.volumes` is set
    template: worker/statefulset.yaml
    set:
      worker:
        volumes:
          - name: disk1
            emptyDir:
              sizeLimit: 10Gi
          - name: disk2
            hostPath:
              type: DirectoryOrCreate
              path: /mnt/disk2
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: disk1
            emptyDir:
              sizeLimit: 10Gi
      - contains:
          path: spec.template.spec.volumes
          content:
            name: disk2
            hostPath:
              type: DirectoryOrCreate
              path: /mnt/disk2

  - it: Should add node selector if `worker.nodeSelector` is set
    template: worker/statefulset.yaml
    set:
      worker:
        nodeSelector:
          key1: value1
          key2: value2
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.key1
          value: value1
      - equal:
          path: spec.template.spec.nodeSelector.key2
          value: value2

  - it: Should add tolerations if `worker.tolerations` is set
    template: worker/statefulset.yaml
    set:
      worker:
        tolerations:
          - key: key1
            operator: Equal
            value: value1
            effect: NoSchedule
          - key: key2
            operator: Exists
            effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: key1
              operator: Equal
              value: value1
              effect: NoSchedule
            - key: key2
              operator: Exists
              effect: NoSchedule

  - it: Should use the specified affinity if `worker.affinity` is specified
    template: worker/statefulset.yaml
    set:
      worker:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values:
                        - antarctica-east1
                        - antarctica-west1
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: another-node-label-key
                      operator: In
                      values:
                        - another-node-label-value
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity
          value:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values:
                        - antarctica-east1
                        - antarctica-west1
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: another-node-label-key
                      operator: In
                      values:
                        - another-node-label-value

  - it: Should use the specified priority class name if `worker.priorityClass.name` is set
    template: worker/statefulset.yaml
    set:
      worker:
        priorityClass:
          name: test-priority-class
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: test-priority-class

  - it: Should use the specified dns policy if `worker.dnsPolicy` is set
    template: worker/statefulset.yaml
    set:
      worker:
        dnsPolicy: ClusterFirstWithHostNet
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet

  - it: Should enable host network if `worker.hostNetwork` is set to true
    template: worker/statefulset.yaml
    set:
      worker:
        hostNetwork: true
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true

  - it: Should use the specified security context if `worker.podSecurityContext` is set
    template: worker/statefulset.yaml
    set:
      worker:
        podSecurityContext:
          runAsUser: 1000
          runAsGroup: 2000
          fsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 2000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000

  - it: Should add volume claim templates if `worker.volumeClaimTemplates` is set
    template: worker/statefulset.yaml
    set:
      worker:
        volumeClaimTemplates:
          - metadata:
              name: test-volume-claim-template-1
            spec:
              accessModes:
                - ReadWriteMany
              resources:
                request:
                  storage: 100Gi
                limits:
                  storage: 100Gi
          - metadata:
              name: test-volume-claim-template-2
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                request:
                  storage: 200Gi
                limits:
                  storage: 200Gi
    asserts:
      - contains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: test-volume-claim-template-1
            spec:
              accessModes:
                - ReadWriteMany
              resources:
                request:
                  storage: 100Gi
                limits:
                  storage: 100Gi
      - contains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: test-volume-claim-template-2
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                request:
                  storage: 200Gi
                limits:
                  storage: 200Gi

  - it: Should add extra init containers when `worker.extraInitContainers` is set
    template: worker/statefulset.yaml
    set:
      worker:
        volumeMounts: []
        extraInitContainers:
          - name: custom-init
            image: busybox:1.36
            command:
              - sh
              - -c
              - echo "hello celeborn"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: custom-init
      - equal:
          path: spec.template.spec.initContainers[0].command[2]
          value: echo "hello celeborn"

  - it: Should not have initContainers when no volumes and extraInitContainers
    template: worker/statefulset.yaml
    set:
      worker:
        volumeMounts: []
        extraInitContainers: []
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: Should create a single worker statefulset when zone-aware replication is disabled
    template: worker/statefulset.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: celeborn-worker
      - notExists:
          path: spec.selector.matchLabels["celeborn.apache.org/zone"]

  - it: Should create one worker statefulset per zone if `worker.zoneAwareReplication` is enabled
    template: worker/statefulset.yaml
    set:
      worker:
        replicas: 9
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1b
            - name: us-east-1c
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: celeborn-worker-us-east-1b
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels["celeborn.apache.org/zone"]
          value: us-east-1b
        documentIndex: 1
      - equal:
          path: spec.template.metadata.labels["celeborn.apache.org/zone"]
          value: us-east-1b
        documentIndex: 1
      - equal:
          path: spec.serviceName
          value: celeborn-worker-svc
        documentIndex: 1

  - it: Should split `worker.replicas` across zones, rounding up
    template: worker/statefulset.yaml
    set:
      worker:
        replicas: 5
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1b
            - name: us-east-1c
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: Should use the zone replicas if `zones[].replicas` is set
    template: worker/statefulset.yaml
    set:
      worker:
        replicas: 9
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
              replicas: 7
    asserts:
      - equal:
          path: spec.replicas
          value: 7

  - it: Should merge the zone node selector over `worker.nodeSelector`
    template: worker/statefulset.yaml
    set:
      worker:
        nodeSelector:
          workload: celeborn
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
              nodeSelector:
                topology.kubernetes.io/zone: us-east-1a
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            workload: celeborn
            topology.kubernetes.io/zone: us-east-1a

  - it: Should use the zone affinity if `zones[].affinity` is set
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: topology.kubernetes.io/zone
                            operator: In
                            values:
                              - us-east-1a
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: us-east-1a

  - it: Should fail if zone-aware replication is enabled without zones
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones: []
    asserts:
      - failedTemplate:
          errorMessage: worker.zoneAwareReplication.enabled is true but worker.zoneAwareReplication.zones is empty

  - it: Should not have a preStop drain hook as default
    template: worker/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - notContains:
          path: spec.template.spec.volumes[0].configMap.items
          content:
            key: worker-drain.sh
            path: worker-drain.sh

  - it: Should run the mounted drain script from the preStop hook
    template: worker/statefulset.yaml
    set:
      worker:
        drain:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - /bin/sh
            - /opt/celeborn/drain/worker-drain.sh
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: celeborn-conf
            subPath: worker-drain.sh
            mountPath: /opt/celeborn/drain/worker-drain.sh
      - contains:
          path: spec.template.spec.volumes[0].configMap.items
          content:
            key: worker-drain.sh
            path: worker-drain.sh

  - it: Should pass the pod, statefulset and port to the drain script
    template: worker/statefulset.yaml
    set:
      worker:
        drain:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: STS_NAME
            value: celeborn-worker
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: WORKER_HTTP_PORT
            value: "9096"
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: ALWAYS_DECOMMISSION
            value: "false"

  - it: Should tell the drain script to always decommission when asked
    template: worker/statefulset.yaml
    set:
      worker:
        drain:
          enabled: true
          alwaysDecommission: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[4].value
          value: "true"

  - it: Should point the drain script at the zone statefulset
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
        drain:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STS_NAME
            value: celeborn-worker-us-east-1a

  - it: Should not add the preStop drain hook if `worker.drain` is disabled
    template: worker/statefulset.yaml
    set:
      worker:
        drain:
          enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: Should not inject POD_NAME when the drain is disabled
    template: worker/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: CELEBORN_WORKER_MEMORY

  - it: Should not set the zone metric label when zone-aware replication is off
    template: worker/statefulset.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: extraLabels

  - it: Should publish the zone as a metric label in each zone
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1b
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CELEBORN_ZONE_METRIC_LABELS
            value: zone=us-east-1b
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: extraLabels=\$CELEBORN_ZONE_METRIC_LABELS
        documentIndex: 1

  - it: Should append the zone to any configured extra metric labels
    template: worker/statefulset.yaml
    set:
      celeborn:
        celeborn.metrics.extraLabels: env=prod
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CELEBORN_ZONE_METRIC_LABELS
            value: env=prod,zone=us-east-1a

  - it: Should not set the zone metric label if `metricsLabel` is false
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          metricsLabel: false
          zones:
            - name: us-east-1a
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: extraLabels

  - it: Should fail if a zone has no name
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - nodeSelector:
                topology.kubernetes.io/zone: us-east-1a
    asserts:
      - failedTemplate:
          errorMessage: every entry in worker.zoneAwareReplication.zones needs a name

  - it: Should fail if two zones share a name
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1a
    asserts:
      - failedTemplate:
          errorMessage: worker.zoneAwareReplication.zones has duplicate names

  - it: "Should honour an explicit `zones[].replicas: 0`"
    template: worker/statefulset.yaml
    set:
      worker:
        replicas: 6
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
              replicas: 0
            - name: us-east-1b
    asserts:
      - equal:
          path: spec.replicas
          value: 0
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 1

  - it: Should let an empty `zones[].affinity` clear the chart affinity for that zone
    template: worker/statefulset.yaml
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
              affinity: {}
            - name: us-east-1b
    asserts:
      - notExists:
          path: spec.template.spec.affinity
        documentIndex: 0
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity
        documentIndex: 1

  - it: Should not interpolate the metric label value into the start command
    template: worker/statefulset.yaml
    set:
      celeborn:
        celeborn.metrics.extraLabels: env=$(id -u)
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CELEBORN_ZONE_METRIC_LABELS
            value: env=$(id -u),zone=us-east-1a
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[4]
          pattern: id -u
