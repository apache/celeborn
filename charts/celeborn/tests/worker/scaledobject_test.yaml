suite: Test Celeborn worker scaled object

templates:
  - worker/scaledobject.yaml

release:
  name: celeborn

tests:
  - it: Should not create a scaled object as default
    asserts:
      - hasDocuments:
          count: 0

  - it: Should create a scaled object if `worker.autoscaling.enabled` is true
    set:
      worker:
        replicas: 4
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          maxReplicaCount: 8
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: celeborn-worker
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: StatefulSet
            name: celeborn-worker
      - equal:
          path: spec.minReplicaCount
          value: 4
      - equal:
          path: spec.maxReplicaCount
          value: 8

  - it: Should create one scaled object per zone, each targeting its own statefulset
    set:
      worker:
        replicas: 9
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1b
            - name: us-east-1c
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: celeborn-worker-us-east-1c
        documentIndex: 2
      - equal:
          path: spec.scaleTargetRef.name
          value: celeborn-worker-us-east-1c
        documentIndex: 2
      - equal:
          path: spec.minReplicaCount
          value: 3
        documentIndex: 2

  - it: Should render the zone into the trigger query
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1b
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value{pod=~"celeborn-worker-{{ .zone.name }}-.*"}
                threshold: "1000"
    asserts:
      - equal:
          path: spec.triggers[2].metadata.query
          value: metrics_ActiveShuffleSize_Value{pod=~"celeborn-worker-us-east-1b-.*"}

  - it: Should use `worker.autoscaling.minReplicaCount` when it is set
    set:
      worker:
        replicas: 9
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          minReplicaCount: 2
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 2

  - it: Should pass scaling behavior through to the HPA
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 1800
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.stabilizationWindowSeconds
          value: 1800

  - it: Should add the disk and memory usage triggers by default
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 2
      - equal:
          path: spec.triggers[0].metricType
          value: Value
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_DeviceCelebornFreeBytes_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\}
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "0.70"
      - equal:
          path: spec.triggers[1].metricType
          value: Value
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: max\(metrics_DirectMemoryUsageRatio_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\}
      - equal:
          path: spec.triggers[1].metadata.threshold
          value: "0.70"

  - it: Should exclude decommissioning workers from both default triggers
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_IsDecommissioningWorker_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\} == 0
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: metrics_IsDecommissioningWorker_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\} == 0
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: DirectMemoryUsageRatio

  - it: Should scope the default triggers to the zone's own statefulset
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should scope by pod name when the zone metric label is off
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          metricsLabel: false
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should not select another release's workers in the same namespace
    release:
      name: beta
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"beta-celeborn-worker-\[0-9\]\+"
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"alpha-celeborn-worker

  - it: Should not select another release's workers sharing a zone name
    release:
      name: beta
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"beta-celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should drop a default trigger that is disabled
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          memoryUsage:
            enabled: false
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 1
      - equal:
          path: spec.triggers[0].metricType
          value: Value

  - it: Should append user triggers after the built-in ones
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 6 * * *
                end: 0 20 * * *
                desiredReplicas: "6"
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 3
      - equal:
          path: spec.triggers[2].type
          value: cron

  - it: Should fail if a built-in trigger is enabled without a prometheus address
    set:
      worker:
        autoscaling:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.prometheusAddress is required by the built-in triggers

  - it: Should fail if autoscaling is enabled with no trigger at all
    set:
      worker:
        autoscaling:
          enabled: true
          diskUsage:
            enabled: false
          memoryUsage:
            enabled: false
          triggers: []
    asserts:
      - failedTemplate:
          errorMessage: "worker.autoscaling.enabled is true but no trigger is: enable worker.autoscaling.diskUsage or memoryUsage, or set worker.autoscaling.triggers"

  - it: Should allow scaling to zero
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          minReplicaCount: 0
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0
