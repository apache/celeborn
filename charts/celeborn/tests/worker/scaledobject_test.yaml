suite: Test Celeborn worker scaled object

templates:
  - worker/scaledobject.yaml

release:
  name: celeborn

tests:
  - it: Should not create a scaled object as default
    asserts:
      - hasDocuments:
          count: 0

  - it: Should create a scaled object if `worker.autoscaling.enabled` is true
    set:
      worker:
        replicas: 4
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          maxReplicaCount: 8
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: celeborn-worker
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: StatefulSet
            name: celeborn-worker
      - equal:
          path: spec.minReplicaCount
          value: 4
      - equal:
          path: spec.maxReplicaCount
          value: 8

  - it: Should create one scaled object per zone, each targeting its own statefulset
    set:
      worker:
        replicas: 9
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
            - name: us-east-1b
            - name: us-east-1c
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: celeborn-worker-us-east-1c
        documentIndex: 2
      - equal:
          path: spec.scaleTargetRef.name
          value: celeborn-worker-us-east-1c
        documentIndex: 2
      - equal:
          path: spec.minReplicaCount
          value: 3
        documentIndex: 2

  - it: Should render the zone into the trigger query
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1b
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value{pod=~"celeborn-worker-{{ .zone.name }}-.*"}
                threshold: "1000"
    asserts:
      - equal:
          path: spec.triggers[2].metadata.query
          value: metrics_ActiveShuffleSize_Value{pod=~"celeborn-worker-us-east-1b-.*"}

  - it: Should use `worker.autoscaling.minReplicaCount` when it is set
    set:
      worker:
        replicas: 9
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          minReplicaCount: 2
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 2

  - it: Should pass scaling behavior through to the HPA
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 1800
          triggers:
            - type: prometheus
              metadata:
                serverAddress: http://prometheus:9090
                query: metrics_ActiveShuffleSize_Value
                threshold: "1000"
    asserts:
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.stabilizationWindowSeconds
          value: 1800

  - it: Should add the disk and memory usage triggers by default
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 2
      - equal:
          path: spec.triggers[0].metricType
          value: Value
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_DeviceCelebornFreeBytes_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\}
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "0.70"
      - equal:
          path: spec.triggers[1].metricType
          value: Value
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: max\(metrics_DirectMemoryUsageRatio_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\}
      - equal:
          path: spec.triggers[1].metadata.threshold
          value: "0.70"

  - it: Should exclude decommissioning workers from both default triggers
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_IsDecommissioningWorker_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\} == 0
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: metrics_IsDecommissioningWorker_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\} == 0
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: DirectMemoryUsageRatio

  - it: Should scope the default triggers to the zone's own statefulset
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should scope by pod name when the zone metric label is off
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          metricsLabel: false
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should not select another release's workers in the same namespace
    release:
      name: beta
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"beta-celeborn-worker-\[0-9\]\+"
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"alpha-celeborn-worker

  - it: Should not select another release's workers sharing a zone name
    release:
      name: beta
    set:
      worker:
        zoneAwareReplication:
          enabled: true
          zones:
            - name: us-east-1a
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: pod=~"beta-celeborn-worker-us-east-1a-\[0-9\]\+"

  - it: Should drop a default trigger that is disabled
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          memoryUsage:
            enabled: false
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 1
      - equal:
          path: spec.triggers[0].metricType
          value: Value

  - it: Should append user triggers after the built-in ones
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          triggers:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 6 * * *
                end: 0 20 * * *
                desiredReplicas: "6"
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 3
      - equal:
          path: spec.triggers[2].type
          value: cron

  - it: Should fail if a built-in trigger is enabled without a prometheus address
    set:
      worker:
        autoscaling:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.prometheusAddress is required by the built-in triggers

  - it: Should fail if autoscaling is enabled with no trigger at all
    set:
      worker:
        autoscaling:
          enabled: true
          diskUsage:
            enabled: false
          memoryUsage:
            enabled: false
          triggers: []
    asserts:
      - failedTemplate:
          errorMessage: "worker.autoscaling.enabled is true but no trigger is: enable worker.autoscaling.diskUsage, memoryUsage or activeSlots, or set worker.autoscaling.triggers"

  - it: Should allow scaling to zero with a trigger of its own
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          minReplicaCount: 0
          triggers:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 6 * * *
                end: 0 20 * * *
                desiredReplicas: "3"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0

  - it: Should fail scaling to zero on the built-in triggers alone
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          minReplicaCount: 0
    asserts:
      - failedTemplate:
          errorMessage: "worker.autoscaling.minReplicaCount: 0 needs a trigger in worker.autoscaling.triggers that does not depend on the workers' own metrics: the built-in ones go silent once the last worker is gone, and the statefulset could never scale back up"

  - it: Should append `worker.autoscaling.extraSelector` to every built-in selector
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          extraSelector: cluster="prod"
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_DeviceCelebornFreeBytes_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+",cluster="prod"\}
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: metrics_IsDecommissioningWorker_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+",cluster="prod"\} == 0
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: metrics_DirectMemoryUsageRatio_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+",cluster="prod"\}

  - it: Should not leave a stray comma around `worker.autoscaling.extraSelector`
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          extraSelector: ' ,cluster="prod",env="a", '
    asserts:
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: pod=~"celeborn-worker-\[0-9\]\+",cluster="prod",env="a"\}

  - it: Should read instant values when `worker.autoscaling.window` is empty
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: avg_over_time
      - notMatchRegex:
          path: spec.triggers[1].metadata.query
          pattern: avg_over_time

  - it: Should average the built-in gauges over `worker.autoscaling.window`
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          window: 5m
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: 1 - avg_over_time\(metrics_DeviceCelebornFreeBytes_Value\{[^}]*\}\[5m\]\) / clamp_max\(avg_over_time\(metrics_DeviceCelebornTotalBytes_Value\{[^}]*\}\[5m\]\), [0-9]+\)
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: max\(avg_over_time\(metrics_DirectMemoryUsageRatio_Value\{[^}]*\}\[5m\]\) and on
      - notMatchRegex:
          path: spec.triggers[1].metadata.query
          pattern: avg_over_time\(metrics_IsDecommissioningWorker_Value

  - it: Should fail on a `worker.autoscaling.window` that is not a PromQL duration
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          window: 5 minutes
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.window must be a positive PromQL duration such as 5m or 1m30s, got "5 minutes"

  - it: Should fail on a zero `worker.autoscaling.window`
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          window: 000ms
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.window must be a positive PromQL duration such as 5m or 1m30s, got "000ms"

  - it: Should fail on a `worker.autoscaling.window` with its units out of order
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          window: 30s1m
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.window must be a positive PromQL duration such as 5m or 1m30s, got "30s1m"

  - it: Should accept a compound `worker.autoscaling.window`
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          window: 1m30s
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: avg_over_time\(metrics_DeviceCelebornFreeBytes_Value\{[^}]*\}\[1m30s\]\)
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: avg_over_time\(metrics_DirectMemoryUsageRatio_Value\{[^}]*\}\[1m30s\]\)

  - it: Should pace scale-in by default when the drain is enabled
    set:
      rbac:
        create: true
      worker:
        drain:
          enabled: true
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown
          value:
            stabilizationWindowSeconds: 3600
            policies:
              - type: Pods
                value: 1
                periodSeconds: 1800

  - it: Should keep the default scale-in pacing alongside a user scaleUp
    set:
      rbac:
        create: true
      worker:
        drain:
          enabled: true
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          behavior:
            scaleUp:
              stabilizationWindowSeconds: 60
    asserts:
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.stabilizationWindowSeconds
          value: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.stabilizationWindowSeconds
          value: 3600

  - it: Should not override a user scaleDown when the drain is enabled
    set:
      rbac:
        create: true
      worker:
        drain:
          enabled: true
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          behavior:
            scaleDown:
              stabilizationWindowSeconds: 600
    asserts:
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown
          value:
            stabilizationWindowSeconds: 600

  - it: Should not add a behavior when the drain is disabled and none is set
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - notExists:
          path: spec.advanced

  - it: Should add the active slots trigger when enabled
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          activeSlots:
            enabled: true
            threshold: 2000
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 3
      - equal:
          path: spec.triggers[2].metricType
          value: AverageValue
      - matchRegex:
          path: spec.triggers[2].metadata.query
          pattern: ^sum\(metrics_ActiveSlotsCount_Value\{role="Worker",namespace="NAMESPACE",pod=~"celeborn-worker-\[0-9\]\+"\} and on \(instance\) metrics_IsDecommissioningWorker_Value\{[^}]*\} == 0\)$
      - equal:
          path: spec.triggers[2].metadata.threshold
          value: "2000"

  - it: Should count the active slots trigger as a trigger on its own
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          diskUsage:
            enabled: false
          memoryUsage:
            enabled: false
          activeSlots:
            enabled: true
            threshold: "2000"
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 1

  - it: Should fail if the active slots trigger has no threshold
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          activeSlots:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.activeSlots.threshold is required when the active slots trigger is enabled

  - it: Should average the disks by default
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: ^avg\(\(1 - metrics_DeviceCelebornFreeBytes_Value
      - matchRegex:
          path: spec.triggers[1].metadata.query
          pattern: ^max\(

  - it: Should read the fullest disk with `worker.autoscaling.diskUsage.aggregation` max
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          diskUsage:
            aggregation: max
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: ^max\(\(1 - metrics_DeviceCelebornFreeBytes_Value

  - it: Should fail on an unknown disk aggregation
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
          diskUsage:
            aggregation: sum
    asserts:
      - failedTemplate:
          errorMessage: worker.autoscaling.diskUsage.aggregation must be max or avg, got "sum"

  - it: Should cap the disk trigger's total at the default `capacity=` of the storage dirs
    set:
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: / clamp_max\(metrics_DeviceCelebornTotalBytes_Value\{[^}]*\}, 107374182400\)\)

  - it: Should cap the disk trigger's total at the largest `capacity=` of the storage dirs
    set:
      celeborn:
        celeborn.worker.storage.dirs: /mnt/disk1:disktype=SSD:capacity=600Gi,/mnt/disk2:capacity=1T
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: clamp_max\(metrics_DeviceCelebornTotalBytes_Value\{[^}]*\}, 1099511627776\)

  - it: Should not cap the disk trigger's total when a storage dir has no `capacity=`
    set:
      celeborn:
        celeborn.worker.storage.dirs: /mnt/disk1:disktype=SSD:capacity=600Gi,/mnt/disk2:disktype=SSD
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - notMatchRegex:
          path: spec.triggers[0].metadata.query
          pattern: clamp_max
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: / metrics_DeviceCelebornTotalBytes_Value\{[^}]*\}\)

  - it: Should fail on an unknown `capacity=` unit
    set:
      celeborn:
        celeborn.worker.storage.dirs: /mnt/disk1:capacity=600zz
      worker:
        autoscaling:
          enabled: true
          prometheusAddress: http://prometheus:9090
    asserts:
      - failedTemplate:
          errorMessage: 'celeborn.worker.storage.dirs: unknown capacity unit in "/mnt/disk1:capacity=600zz"'
