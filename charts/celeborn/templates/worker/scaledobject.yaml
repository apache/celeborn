{{- if .Values.worker.autoscaling.enabled }}
{{- if not (or .Values.worker.autoscaling.diskUsage.enabled .Values.worker.autoscaling.memoryUsage.enabled .Values.worker.autoscaling.triggers) }}
{{- fail "worker.autoscaling.enabled is true but no trigger is: enable worker.autoscaling.diskUsage or memoryUsage, or set worker.autoscaling.triggers" }}
{{- end }}
{{- /* One ScaledObject per worker statefulset, so each zone scales on its own load. */}}
{{- $zones := list dict }}
{{- if .Values.worker.zoneAwareReplication.enabled }}
{{- $zones = .Values.worker.zoneAwareReplication.zones }}
{{- end }}
{{- range $index, $zone := $zones }}
{{- if $index }}
---
{{- end }}
{{- with dict "Values" $.Values "Release" $.Release "Chart" $.Chart "Capabilities" $.Capabilities "Template" $.Template "Files" $.Files "zone" $zone }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "celeborn.worker.statefulSet.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "celeborn.worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "celeborn.worker.statefulSet.name" . }}
  {{- /* Not `default`: it treats an explicit 0 as unset, which rules out scaling to zero. */}}
  minReplicaCount: {{ if kindIs "invalid" .Values.worker.autoscaling.minReplicaCount }}{{ include "celeborn.worker.replicas" . }}{{ else }}{{ .Values.worker.autoscaling.minReplicaCount }}{{ end }}
  maxReplicaCount: {{ .Values.worker.autoscaling.maxReplicaCount }}
  pollingInterval: {{ .Values.worker.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.worker.autoscaling.cooldownPeriod }}
  {{- with .Values.worker.autoscaling.behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  triggers:
    {{- with include "celeborn.worker.autoscaling.defaultTriggers" . | trim }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- $ctx := . }}
    {{- with .Values.worker.autoscaling.triggers }}
    {{- /*
    Checked before rendering: without a zone `.zone.name` yields an empty string, so a
    `zone=""` matcher would quietly match every worker rather than failing.
    */}}
    {{- if and (not $ctx.Values.worker.zoneAwareReplication.enabled) (contains ".zone" (toYaml .)) }}
    {{- fail "a worker.autoscaling.triggers entry references .zone, which only has a value when worker.zoneAwareReplication is enabled" }}
    {{- end }}
    {{- tpl (toYaml .) $ctx | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
